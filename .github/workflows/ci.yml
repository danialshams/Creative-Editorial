name: Quality & Production Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser QA — RTL, assets, responsive, dialogs
        run: npm run test:e2e
      - name: Keep visual screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maison-noor-visual-review
          path: test-results/
          retention-days: 7
